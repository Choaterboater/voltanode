risk:
  max_drawdown_pct: 0.1
  max_position_size_pct: 0.2
  max_exposure_per_asset_pct: 0.3
  default_stop_loss_pct: 0.02
  default_take_profit_pct: 0.06
  position_sizing_method: percentage
  position_sizing_value: 0.02
  fee_rate: 0.001
  slippage_model: fixed
  slippage_bps: 5.0
api:
  host: 0.0.0.0
  port: 8000
  cors_origins:
  - http://localhost:3000
backtest:
  default_initial_balance:
    USDT: 10000.0
    USD: 10000.0
  allow_short: true
strategies:
  momentum:
    enabled: true
    symbols:
    - bitcoin
    - ethereum
    fast_ema: 12
    slow_ema: 26
    trend_filter_ema: 200
  mean_reversion:
    enabled: true
    symbols:
    - bitcoin
    rsi_period: 14
    rsi_overbought: 70
    rsi_oversold: 30
    bb_period: 20
    bb_std: 2.0
  grid:
    enabled: false
    symbols:
    - bitcoin
    grid_levels: 10
    grid_spacing_pct: 0.01
    quantity_per_grid: 0.01
  breakout:
    enabled: false
    symbols:
    - ethereum
    lookback_period: 20
    volume_multiplier: 1.5
    breakout_threshold_pct: 0.005
  arbitrage:
    enabled: false
    symbols:
    - bitcoin
    - ethereum
    min_spread_pct: 0.5
  macd:
    enabled: true
    symbols:
    - bitcoin
    fast: 12
    slow: 26
    signal: 9
  ensemble_ml:
    enabled: true
    symbols:
    - bitcoin
    - ethereum
    buy_threshold: 0.6
    sell_threshold: 0.4
    indicators:
      rsi:
        weight: 0.2
        period: 14
      macd:
        weight: 0.3
      ema_cross:
        weight: 0.2
        fast: 12
        slow: 26
      bb_position:
        weight: 0.15
        period: 20
      volume_trend:
        weight: 0.15
live_mode:
  enabled: true
  default_broker: alpaca
  confirmation_required: true
brokers:
  binance:
    testnet: true
    paper: false
    api_key_encrypted: ''
    api_secret_encrypted: ''
