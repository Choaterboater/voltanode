# Paper Trading Bot Configuration

app:
  name: "PaperTradingBot"
  log_level: INFO
  json_logs: true
  data_dir: "./data"

engine:
  tick_interval_seconds: 5.0
  max_accounts: 10
  auto_start_strategies: true

market_data:
  coingecko:
    enabled: true
    base_url: "https://api.coingecko.com/api/v3"
    rate_limit_per_minute: 30
  yfinance:
    enabled: true
  cache:
    enabled: true
    ttl_seconds: 300
    max_entries: 10000
  default_timeframe: "1h"
  symbols:
